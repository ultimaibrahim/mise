<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      --bg: #F5EFE6;
      --surface: #FFFFFF;
      --dark: #3D5A47;
      --sage: #7A9E8A;
      --border: #E2D9CC;
      --text: #1A1A1A;
      --text-muted: #666666;
      --accent: #2E5D4B;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border); flex-shrink: 0; }
    h2 { font-size: 14px; font-weight: 700; color: var(--dark); }

    .route-toggle { display: flex; background: var(--border); padding: 3px; border-radius: 10px; flex-shrink: 0; }
    .toggle-btn { flex: 1; border: none; background: none; padding: 8px 10px; font-size: 11px; font-weight: 700; color: #555; cursor: pointer; border-radius: 8px; transition: all 0.15s ease; text-align: center; }
    .toggle-btn.active { background: var(--dark); color: #FFF; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

    .search-box { position: relative; flex-shrink: 0; }
    .search-input { width: 100%; padding: 10px 12px; font-size: 13px; border: 2px solid var(--sage); border-radius: var(--radius); outline: none; background: var(--surface); }
    .search-input:focus { border-color: var(--dark); }

    .content-area { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

    .results-list { flex: 1; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; display: flex; flex-direction: column; gap: 3px; }
    .product-item { padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: #FAFAFA; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .product-item:hover { background: #F0F4F1; }
    .product-item.selected { background: #E2EFE6; border-color: var(--dark); font-weight: 600; }
    .item-title { font-size: 12px; color: var(--text); }
    .item-cat { font-size: 9.5px; color: var(--text-muted); }

    .capture-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .selected-banner { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .banner-title { font-size: 12px; font-weight: 700; color: var(--dark); }

    .input-row { display: flex; gap: 8px; align-items: center; }
    .num-input { flex: 1; padding: 10px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 10px; outline: none; font-weight: 700; text-align: center; background: #FAFAFA; }
    .num-input:focus { border-color: var(--dark); background: #FFF; }
    .text-input { width: 100%; padding: 8px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 8px; outline: none; }

    .btn-submit { padding: 12px; background: var(--dark); color: #FFF; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(61,90,71,0.25); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #BBB; cursor: not-allowed; }

    .status-msg { font-size: 11px; text-align: center; height: 16px; font-weight: 600; }
    .status-msg.success { color: var(--dark); }
    .status-msg.error { color: #C62828; }
  </style>
</head>
<body>

  <header>
    <h2>🔄 Registrar Traspaso</h2>
    <span id="lblTiendaLocal" style="font-size:11px; font-weight:700; color:var(--dark);"></span>
  </header>

  <div class="route-toggle">
    <button class="toggle-btn active" id="btnSalida" onclick="cambiarTipo('ENVIAR')">➡️ Entregar / Enviar</button>
    <button class="toggle-btn" id="btnEntrada" onclick="cambiarTipo('RECIBIR')">⬅️ Recibir / Préstamo</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar insumo para traspasar..." autocomplete="off">
  </div>

  <div class="content-area">
    <div class="results-list" id="resultsList">
      <!-- Lista táctil -->
    </div>

    <div class="capture-card">
      <div class="selected-banner">
        <div class="banner-title" id="lblSelProducto">Selecciona un producto</div>
        <span id="lblSelUnidad" style="font-size:10px; font-weight:700; color:var(--dark); background:var(--bg); padding:2px 8px; border-radius:4px;">-</span>
      </div>

      <div class="input-row">
        <input type="number" id="txtCantidad" class="num-input" placeholder="0" min="0.001" step="any">
      </div>

      <input type="text" id="txtMotivo" class="text-input" placeholder="Motivo (opcional, ej. Préstamo por alta demanda)">

      <div class="status-msg" id="statusMsg"></div>

      <button class="btn-submit" id="btnSubmit" onclick="enviarTraspaso()">
        <span id="btnSubmitText">⚡ Registrar Traspaso</span>
      </button>
    </div>
  </div>

  <script>
    let config = { miBodegaKey: "BA", miBodegaNombre: "Andares", contraparteKey: "BM", contraparteNombre: "Mercado" };
    let tipoOperacion = "ENVIAR"; // 'ENVIAR' o 'RECIBIR'
    let catalogo = [];
    let seleccionado = null;

    window.onload = function() {
      document.getElementById("searchInput").focus();
      cargarConfigYCatalogo();

      document.getElementById("searchInput").addEventListener("input", filtrar);
      document.getElementById("txtCantidad").addEventListener("keydown", function(e) {
        if (e.key === "Enter") document.getElementById("txtMotivo").focus();
      });
      document.getElementById("txtMotivo").addEventListener("keydown", function(e) {
        if (e.key === "Enter") enviarTraspaso();
      });
    };

    function cambiarTipo(tipo) {
      tipoOperacion = tipo;
      document.getElementById("btnSalida").className = "toggle-btn" + (tipo === "ENVIAR" ? " active" : "");
      document.getElementById("btnEntrada").className = "toggle-btn" + (tipo === "RECIBIR" ? " active" : "");
      actualizarBotonTexto();
    }

    function actualizarBotonTexto() {
      const btn = document.getElementById("btnSubmitText");
      if (tipoOperacion === "ENVIAR") {
        btn.innerText = `➡️ Enviar a ${config.contraparteNombre}`;
      } else {
        btn.innerText = `⬅️ Recibir de ${config.contraparteNombre}`;
      }
    }

    function cargarConfigYCatalogo() {
      mostrarEstado("Cargando catálogo...", "");
      google.script.run
        .withSuccessHandler(function(res) {
          config = res;
          catalogo = res.productos || [];
          document.getElementById("lblTiendaLocal").innerText = config.miBodegaNombre;
          actualizarBotonTexto();
          filtrar();
          mostrarEstado("", "");
        })
        .withFailureHandler(function(err) {
          mostrarEstado("Error: " + err.message, "error");
        })
        .obtenerCatalogoParaTraspasoTienda();
    }

    function filtrar() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const list = document.getElementById("resultsList");
      list.innerHTML = "";

      const filtrados = catalogo.filter(p => p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));

      if (filtrados.length === 0) {
        list.innerHTML = `<div style="padding:12px; font-size:11px; color:#888; text-align:center;">No se encontraron productos.</div>`;
        return;
      }

      filtrados.slice(0, 30).forEach(p => {
        const item = document.createElement("div");
        item.className = "product-item" + (seleccionado && seleccionado.name === p.name ? " selected" : "");
        item.onclick = function() { seleccionar(p); };
        item.innerHTML = `
          <div>
            <div class="item-title">${p.name}</div>
            <div class="item-cat">${p.cat}</div>
          </div>
          <span style="font-size:10px; font-weight:700; color:var(--dark);">${p.unit}</span>
        `;
        list.appendChild(item);
      });
    }

    function seleccionar(p) {
      seleccionado = p;
      document.getElementById("lblSelProducto").innerText = p.name;
      document.getElementById("lblSelUnidad").innerText = p.unit;
      filtrar();
      document.getElementById("txtCantidad").focus();
    }

    function enviarTraspaso() {
      if (!seleccionado) {
        mostrarEstado("Selecciona un insumo de la lista.", "error");
        return;
      }
      const cant = parseFloat(document.getElementById("txtCantidad").value);
      if (isNaN(cant) || cant <= 0) {
        mostrarEstado("Ingresa una cantidad mayor a 0.", "error");
        document.getElementById("txtCantidad").focus();
        return;
      }

      const origen = (tipoOperacion === "ENVIAR") ? config.miBodegaKey : config.contraparteKey;
      const destino = (tipoOperacion === "ENVIAR") ? config.contraparteKey : config.miBodegaKey;
      const motivo = document.getElementById("txtMotivo").value.trim() || `Traspaso registrado por ${config.miBodegaNombre}`;

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      mostrarEstado("Aplicando en Bodega Central...", "");

      const payload = {
        origen: origen,
        destino: destino,
        producto: seleccionado.name,
        cantidad: cant,
        unidad: seleccionado.unit,
        motivo: motivo
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          mostrarEstado("✅ Traspaso exitoso: " + (res.folio || "OK"), "success");
          document.getElementById("txtCantidad").value = "";
          document.getElementById("txtMotivo").value = "";
          setTimeout(function() {
            google.script.host.close();
          }, 1400);
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          mostrarEstado("❌ " + err.message, "error");
        })
        .registrarTraspasoTiendaRPC(payload);
    }

    function mostrarEstado(msg, tipo) {
      const el = document.getElementById("statusMsg");
      el.className = "status-msg " + (tipo || "");
      el.innerText = msg;
    }
  </script>
</body>
</html>
