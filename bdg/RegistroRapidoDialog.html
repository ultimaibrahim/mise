<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #F5EFE6;
      --surface: #FFFFFF;
      --dark: #3D5A47;
      --sage: #7A9E8A;
      --border: #E2D9CC;
      --text: #1A1A1A;
      --text-muted: #666666;
      --accent: #2E5D4B;
      --amber: #C97D10;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    
    header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); }
    .title-group { display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 15px; font-weight: 700; color: var(--dark); }
    .subtitle { font-size: 11px; color: var(--text-muted); }

    .selector-bar { display: flex; gap: 8px; flex-shrink: 0; }
    .pill-toggle { display: flex; background: var(--border); padding: 3px; border-radius: 8px; }
    .pill-btn { border: none; background: none; padding: 4px 12px; font-size: 11px; font-weight: 600; color: #555; cursor: pointer; border-radius: 6px; transition: all 0.15s ease; }
    .pill-btn.active { background: var(--dark); color: #FFF; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

    .search-box { position: relative; flex-shrink: 0; }
    .search-input { width: 100%; padding: 10px 12px; font-size: 13px; border: 2px solid var(--sage); border-radius: var(--radius); outline: none; background: var(--surface); transition: border-color 0.2s ease; }
    .search-input:focus { border-color: var(--dark); box-shadow: 0 0 0 3px rgba(61,90,71,0.15); }
    
    .content-area { flex: 1; display: flex; gap: 10px; min-height: 0; }
    
    .results-list { flex: 1.2; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .product-item { padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: #FAFAFA; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s ease; }
    .product-item:hover { background: #F0F4F1; border-color: var(--sage); }
    .product-item.selected { background: #E2EFE6; border-color: var(--dark); font-weight: 600; }
    .item-title { font-size: 12px; color: var(--text); }
    .item-cat { font-size: 10px; color: var(--text-muted); }

    .entry-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; }
    .product-details { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .details-title { font-size: 14px; font-weight: 700; color: var(--dark); }
    .details-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .input-grid { display: flex; flex-direction: column; gap: 10px; }
    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .input-field label { font-size: 11px; font-weight: 700; color: var(--dark); }
    .num-input { padding: 8px 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-weight: 600; text-align: center; }
    .num-input:focus { border-color: var(--dark); background: #F4F7F5; }

    .stock-badge { background: #E8F0EA; border: 1px solid var(--sage); padding: 6px 10px; border-radius: 8px; font-size: 11px; color: var(--dark); display: flex; justify-content: space-between; }

    .btn-submit { padding: 10px; background: var(--dark); color: #FFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s ease; width: 100%; }
    .btn-submit:hover { background: var(--accent); }
    .btn-submit:active { transform: scale(0.98); }

    .status-msg { font-size: 11px; text-align: center; height: 16px; font-weight: 600; }
    .status-msg.success { color: var(--dark); }
    .status-msg.error { color: #C62828; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h2>⚡ Registro Rápido de Movimientos</h2>
    </div>
    <div class="selector-bar">
      <div class="pill-toggle">
        <button class="pill-btn active" id="btnBA" onclick="cambiarBodega('BA')">🟢 Andares</button>
        <button class="pill-btn" id="btnBM" onclick="cambiarBodega('BM')">🔵 Mercado</button>
      </div>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Escribe para buscar producto... (Ej. Nutella, Harina)" autocomplete="off">
  </div>

  <div class="content-area">
    <div class="results-list" id="resultsList">
      <!-- Productos filtrados dinámicamente -->
    </div>

    <div class="entry-card">
      <div>
        <div class="product-details">
          <div class="details-title" id="lblProducto">Selecciona un producto</div>
          <div class="details-meta" id="lblCategoria">Categoría: - | Unidad: -</div>
        </div>

        <div class="stock-badge" style="margin-top: 10px;">
          <span>Saldo Anterior: <strong id="lblSaldoAnt">0</strong></span>
          <span>Día: <strong id="lblDiaNombre">Hoy</strong></span>
        </div>

        <div class="input-grid" style="margin-top: 12px;">
          <div class="input-field">
            <label for="txtEntrada">➕ Entrada (+)</label>
            <input type="number" id="txtEntrada" class="num-input" placeholder="0" min="0" step="any">
          </div>
          <div class="input-field">
            <label for="txtSalida">➖ Salida (-)</label>
            <input type="number" id="txtSalida" class="num-input" placeholder="0" min="0" step="any">
          </div>
        </div>
      </div>

      <div>
        <div class="status-msg" id="statusMsg"></div>
        <button class="btn-submit" id="btnGuardar" onclick="guardarMovimiento()">💾 Guardar Movimiento (Enter)</button>
      </div>
    </div>
  </div>

  <script>
    let bodegaActual = "BA";
    let catalogo = [];
    let productoSeleccionado = null;
    let diaActualIndex = 0; // 0 = Lun, 6 = Dom
    let selectedIndex = 0;

    window.onload = function() {
      const dow = new Date().getDay() || 7;
      diaActualIndex = dow - 1; // 0 = Lun, 6 = Dom
      const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
      document.getElementById("lblDiaNombre").innerText = dias[diaActualIndex];

      document.getElementById("searchInput").focus();
      cargarCatalogo();

      // Listeners de teclado
      document.getElementById("searchInput").addEventListener("input", filtrarProductos);
      document.getElementById("searchInput").addEventListener("keydown", manejarTecladoBusqueda);
      document.getElementById("txtEntrada").addEventListener("keydown", function(e) { if(e.key === "Enter") document.getElementById("txtSalida").focus(); });
      document.getElementById("txtSalida").addEventListener("keydown", function(e) { if(e.key === "Enter") guardarMovimiento(); });
    };

    function cambiarBodega(key) {
      bodegaActual = key;
      document.getElementById("btnBA").classList.toggle("active", key === "BA");
      document.getElementById("btnBM").classList.toggle("active", key === "BM");
      cargarCatalogo();
    }

    function cargarCatalogo() {
      document.getElementById("resultsList").innerHTML = "<div style='padding:10px; font-size:11px; text-align:center; color:#777;'>Cargando catálogo...</div>";
      google.script.run
        .withSuccessHandler(onCatalogoCargado)
        .withFailureHandler(onFailure)
        .obtenerCatalogoKardexParaRegistro(bodegaActual);
    }

    function onCatalogoCargado(res) {
      if (!res) {
        document.getElementById("resultsList").innerHTML = "<div style='padding:10px; font-size:11px; color:red;'>Error al cargar catálogo</div>";
        return;
      }
      catalogo = Array.isArray(res) ? res : (res.productos || []);
      if (catalogo.length === 0) {
        document.getElementById("resultsList").innerHTML = "<div style='padding:10px; font-size:11px; text-align:center; color:#777;'>Catálogo vacío o desfasado</div>";
        return;
      }
      filtrarProductos();
    }

    function filtrarProductos() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtrados = catalogo.filter(p => {
        const nm = (p.name || p.nombre || "").toLowerCase();
        const ct = (p.cat || p.categoria || "").toLowerCase();
        return nm.includes(query) || ct.includes(query);
      });
      
      const container = document.getElementById("resultsList");
      container.innerHTML = "";

      if (filtrados.length === 0) {
        container.innerHTML = "<div style='padding:10px; font-size:11px; text-align:center; color:#777;'>No se encontraron productos</div>";
        return;
      }

      filtrados.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "product-item" + (index === 0 ? " selected" : "");
        div.onclick = () => seleccionarProducto(item);
        const pName = item.name || item.nombre || "";
        const pCat = item.cat || item.categoria || "";
        const pUnit = item.unit || item.unidad || "";
        div.innerHTML = `
          <div>
            <div class="item-title">${pName}</div>
            <div class="item-cat">${pCat}</div>
          </div>
          <div style="font-size:11px; font-weight:700; color:var(--dark);">${pUnit}</div>
        `;
        container.appendChild(div);
      });

      if (filtrados.length > 0) {
        seleccionarProducto(filtrados[0]);
      }
    }

    function seleccionarProducto(item) {
      productoSeleccionado = item;
      const pName = item.name || item.nombre || "";
      const pCat = item.cat || item.categoria || "";
      const pUnit = item.unit || item.unidad || "";
      const pSldAnt = item.sldAnt !== undefined ? item.sldAnt : (item.saldoAnt || 0);

      document.getElementById("lblProducto").innerText = pName;
      document.getElementById("lblCategoria").innerText = `Categoría: ${pCat} | Unidad: ${pUnit}`;
      document.getElementById("lblSaldoAnt").innerText = pSldAnt;
      
      // Cargar valores actuales de hoy si existen
      const entActual = item.entHoy || (item.movimientos ? item.movimientos[diaActualIndex * 3] : 0) || 0;
      const salActual = item.salHoy || (item.movimientos ? item.movimientos[diaActualIndex * 3 + 1] : 0) || 0;
      document.getElementById("txtEntrada").value = entActual !== 0 ? entActual : "";
      document.getElementById("txtSalida").value = salActual !== 0 ? salActual : "";
      
      // Resaltar en lista
      const items = document.querySelectorAll(".product-item");
      items.forEach(el => el.classList.remove("selected"));
    }

    function manejarTecladoBusqueda(e) {
      if (e.key === "ArrowDown" || e.key === "Tab") {
        e.preventDefault();
        document.getElementById("txtEntrada").focus();
        document.getElementById("txtEntrada").select();
      }
    }

    function guardarMovimiento() {
      if (!productoSeleccionado) return;

      const ent = parseFloat(document.getElementById("txtEntrada").value) || 0;
      const sal = parseFloat(document.getElementById("txtSalida").value) || 0;
      
      const btn = document.getElementById("btnGuardar");
      btn.disabled = true;
      btn.innerText = "⏳ Guardando...";

      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("statusMsg").innerText = "";

      google.script.run
        .withSuccessHandler(onMovimientoGuardado)
        .withFailureHandler(onFailure)
        .registrarMovimientoRapidoKardex(
          bodegaActual,
          productoSeleccionado.nombre,
          diaActualIndex,
          ent,
          sal
        );
    }

    function onMovimientoGuardado(res) {
      const btn = document.getElementById("btnGuardar");
      btn.disabled = false;
      btn.innerText = "💾 Guardar Movimiento (Enter)";

      if (res && res.exito) {
        document.getElementById("statusMsg").className = "status-msg success";
        document.getElementById("statusMsg").innerText = "✓ Movimiento guardado exitosamente";
        
        // Limpiar para siguiente búsqueda
        document.getElementById("txtEntrada").value = "";
        document.getElementById("txtSalida").value = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("searchInput").focus();
        cargarCatalogo();
      } else {
        document.getElementById("statusMsg").className = "status-msg error";
        document.getElementById("statusMsg").innerText = "❌ " + (res.error || "Error al guardar");
      }
    }

    function onFailure(err) {
      const btn = document.getElementById("btnGuardar");
      btn.disabled = false;
      btn.innerText = "💾 Guardar Movimiento (Enter)";
      document.getElementById("statusMsg").className = "status-msg error";
      document.getElementById("statusMsg").innerText = "❌ " + err.message;
    }
  </script>
</body>
</html>
